# Keep Vercel project alive — ping every 5 minutes
# Prevents free tier from suspending due to inactivity

name: Keep Alive

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  # Also run on manual trigger
  workflow_dispatch:

jobs:
  ping:
    name: Ping Site
    runs-on: ubuntu-latest
    steps:
      - name: Keep project alive
        run: |
          echo "Pinging stokdarah-sulsel.vercel.app at $(date)"
          curl -s -o /dev/null -w "%{http_code}" https://stokdarah-sulsel.vercel.app
          echo ""
          echo "Done — project kept alive"
